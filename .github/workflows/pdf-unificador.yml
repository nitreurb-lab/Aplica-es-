name: Compilar PDF Unificador Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'pdf-unificador/**'
      - '.github/workflows/pdf-unificador.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r pdf-unificador/requirements.txt
      - name: Verificar sintaxe
        run: python -m py_compile pdf-unificador/pdf_unificador.py
      - name: Compilar executavel portatil
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PDF_Unificador pdf-unificador/pdf_unificador.py
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Unificador_Windows_Portatil
          path: dist/PDF_Unificador.exe
          if-no-files-found: error
